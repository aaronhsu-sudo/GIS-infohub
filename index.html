<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="逢甲GIS集團常用服務與辦公資料入口。">
    <title>逢甲GIS集團資訊整合平台</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block">
    <link rel="stylesheet" href="styles.css?v=20260814-2">
</head>
<body class="site-page home-page">
    <div class="background-effects" aria-hidden="true">
        <span class="background-blob background-blob-primary"></span>
        <span class="background-blob background-blob-secondary"></span>
        <span class="background-blob background-blob-tertiary"></span>
        <span class="background-blob background-blob-error"></span>
    </div>

    <div class="header-shell">
        <header class="platform-header">
            <div class="platform-header-content">
                <div class="platform-brand">
                    <span class="material-symbols-outlined filled-symbol platform-brand-icon">hub</span>
                    <h1 class="platform-brand-name">逢甲GIS集團資訊整合平台</h1>
                </div>
                <nav class="main-navigation" aria-label="主選單">
                    <a class="navigation-item navigation-item-active navigation-home" href="index.html" aria-current="page" aria-label="平台首頁"><span class="material-symbols-outlined filled-symbol">home</span></a>
                    <a class="navigation-item" href="administration.html">行政</a>
                    <a class="navigation-item" href="general-affairs.html">總務</a>
                    <a class="navigation-item" href="#">資訊</a>
                    <a class="navigation-item" href="ac.html">財務</a>
                    <a class="navigation-item" href="welfare.html">同仁支持</a>
                    <a class="navigation-item" href="#">集團 Group</a>
                </nav>
            </div>
        </header>
    </div>

    <main class="home-main">
        <section class="home-dashboard page-container" aria-labelledby="dashboard-description">
            <div class="dashboard-toolbar">
                <p id="dashboard-description" class="dashboard-description">快速查找各項核心服務與辦公資料</p>
            </div>

            <div class="portal-grid">
                <a class="portal-card portal-card-administration" href="administration.html">
                    <span class="portal-card-icon"><span class="material-symbols-outlined filled-symbol">verified_user</span></span>
                    <span class="portal-card-title">行政</span>
                </a>
                <a class="portal-card portal-card-general" href="general-affairs.html">
                    <span class="portal-card-icon"><span class="material-symbols-outlined filled-symbol">inventory_2</span></span>
                    <span class="portal-card-title">總務</span>
                </a>
                <a class="portal-card portal-card-it" href="#">
                    <span class="portal-card-icon"><span class="material-symbols-outlined filled-symbol">terminal</span></span>
                    <span class="portal-card-title">資訊</span>
                </a>
                <a class="portal-card portal-card-finance" href="ac.html">
                    <span class="portal-card-icon"><span class="material-symbols-outlined filled-symbol">payments</span></span>
                    <span class="portal-card-title">財務</span>
                </a>
                <a class="portal-card portal-card-welfare" href="welfare.html">
                    <span class="portal-card-icon"><span class="material-symbols-outlined filled-symbol">volunteer_activism</span></span>
                    <span class="portal-card-title">同仁支持</span>
                </a>
                <a class="portal-card portal-card-group" href="#">
                    <span class="portal-card-icon"><span class="material-symbols-outlined filled-symbol">corporate_fare</span></span>
                    <span class="portal-card-title">集團 Group</span>
                </a>
            </div>
        </section>
    </main>

    <footer class="platform-footer home-footer">
        <div class="page-container footer-content"><strong class="footer-brand">逢甲GIS集團</strong></div>
        <div class="footer-accent"></div>
    </footer>

    <button class="ai-assistant" type="button" aria-label="開啟 AI 訊息小幫手">
        <span class="ai-assistant-orb">
            <span class="ai-assistant-pulse"></span>
            <span class="ai-assistant-content">
                <span class="material-symbols-outlined filled-symbol ai-assistant-icon">smart_toy</span>
                <span class="ai-assistant-label">AI小幫手</span>
            </span>
        </span>
        <span class="ai-assistant-tooltip">需要幫助嗎？問問小布的 AI 助理</span>
    </button>
    <script src="script.js?v=20260721-2"></script>
</body>
</html>
